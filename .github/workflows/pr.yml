name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the previous run and saves runner minutes.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vpn
          POSTGRES_PASSWORD: vpn
          POSTGRES_DB: vpn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vpn:vpn@localhost:5432/vpn?sslmode=disable
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install_args: go golangci-lint actionlint shellcheck oapi-codegen sqlc flutter
      - name: Restore Go caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'core/go.sum', '.tool-versions') }}
      - name: Check
        run: make check
      - name: Test
        run: make test

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install_args: go
      - name: Restore Go caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'core/go.sum', '.tool-versions') }}
      - name: Test Go modules
        run: make test-go
