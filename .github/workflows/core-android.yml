name: core-android

# The aar takes minutes to build, so it runs only when its inputs change.
on:
  pull_request:
    paths: &inputs
      - core/**
      - contracts/**
      - .tool-versions
      - .github/workflows/core-android.yml
  push:
    branches: [main]
    paths: *inputs

permissions:
  contents: read

concurrency:
  group: core-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install_args: >-
            go java
            go:github.com/sagernet/gomobile/cmd/gomobile
            go:github.com/sagernet/gomobile/cmd/gobind
      - name: Restore Go caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-android-${{ hashFiles('core/go.sum', '.tool-versions') }}
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          make core-android
      - name: Check bindings
        run: |
          unzip -p core/build/core.aar classes.jar > bindings.jar
          unzip -l bindings.jar | grep -q 'com/vpnclient/core/bind/Core.class'
          unzip -l bindings.jar | grep -q 'com/vpnclient/core/libbox/PlatformInterface.class'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-aar
          path: core/build/core.aar
          retention-days: 7
