swagger_parser:
  schema_path: ../contracts/openapi.yaml
  output_directory: lib/gen/api
  name: vpn_api
  language: dart
  json_serializer: json_serializable
  root_client: true
  root_client_name: VpnApiClient
  put_clients_in_folder: true
