name: vpnclient
description: VPN client for Android and Windows.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.0
  retrofit: ^4.10.0
  url_launcher: ^6.3.3
  win32: ^6.4.0
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  glados: ^1.1.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  pigeon: ^29.1.0
  retrofit_generator: ^10.3.3
  swagger_parser: ^1.45.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/gen/
