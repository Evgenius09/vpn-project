global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  # The node server through panel-tunnel (tech.md 39.5).
  - job_name: vpn-node
    static_configs:
      - targets: [panel-tunnel:9100]
        labels:
          instance: se-sto-1
