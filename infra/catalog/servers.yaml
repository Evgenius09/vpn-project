# Server metadata the panel does not hold (tech.md 6, 29, 39.4). catalog_sync
# publishes a panel host only when it has an entry here. Fields:
#
# - remnawaveHostUuid: 00000000-0000-0000-0000-000000000000
#   group: regular            # regular | whitelist
#   displayName: Frankfurt
#   countryCode: DE           # ISO 3166-1 alpha-2
#   city: Frankfurt           # optional
#   sortWeight: 10
#   enabled: true             # optional, true when omitted
#   portHopping: {ports: "20000-50000", intervalSec: 30}   # hysteria2 hosts only
#
# An invalid file fails the sync and leaves the servers table as it was.
# Staging and prod read this file. Addresses stay in the panel (tech.md 37.2).

# Host se-sto-1-vless.
- remnawaveHostUuid: 6d03977d-2193-46d0-9c57-c7eff7998eb8
  group: regular
  displayName: Stockholm
  countryCode: SE
  city: Stockholm
  sortWeight: 10

# Host se-sto-1-hy2 (tech.md 38.2).
- remnawaveHostUuid: b225a0cb-9d46-4af6-b608-96a248141054
  group: regular
  displayName: Stockholm
