# The API host: backend, database, TLS proxy, and monitoring (tech.md 9).
# /metrics stays on the internal network. Only Caddy publishes ports.
x-backend: &backend
  image: ${BACKEND_IMAGE:-vpnclient-backend:dev}
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vpn
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, vpn]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    restart: "no"
    command: [/app/migrate]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: [/app/api]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend
    command: [/app/worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Long polling for a host without a webhook address (tech.md 36.2, 38.4).
  bot:
    <<: *backend
    command: [/app/bot]
    profiles: [polling]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The panel and node_exporter of the node server listen on loopback only, so
  # the worker and Prometheus reach them through SSH (tech.md 39.5). The
  # restricted key on the node opens only these two ports.
  panel-tunnel:
    build: ./panel-tunnel
    image: vpnclient-panel-tunnel:local
    restart: unless-stopped
    profiles: [panel]
    command:
      - ssh
      - -N
      - -i
      - /run/panel-tunnel/key
      - -o
      - UserKnownHostsFile=/run/panel-tunnel/known_hosts
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=15
      - -o
      - ServerAliveCountMax=3
      - -L
      - 0.0.0.0:3000:127.0.0.1:3000
      - -L
      - 0.0.0.0:9100:127.0.0.1:9100
      - panel-tunnel@${NODE_HOST:-unset}
    volumes:
      - ../../panel-tunnel:/run/panel-tunnel:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  postgres:
  caddy-data:
  prometheus:
  grafana:
