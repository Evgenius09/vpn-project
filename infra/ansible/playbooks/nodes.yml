---
# One server holds the panel and the node on staging (tech.md 37.2).
- name: Deploy the Remnawave panel and node
  hosts: nodes
  become: true
  roles:
    - remnawave-panel
    - remnawave-node

- name: Check every node from this machine
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Run the smoke script
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../scripts/smoke-nodes.sh"
          - "{{ ansible_host }}"
      environment:
        SSH_KEY: "{{ ansible_ssh_private_key_file }}"
      delegate_to: localhost
      changed_when: false
