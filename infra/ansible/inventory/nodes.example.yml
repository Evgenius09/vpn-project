---
# Copy outside the repository and run by hand (tech.md 38.5):
# ansible-playbook -i ~/vpn-staging-notes/nodes.yml playbooks/nodes.yml
# The address, the node name and the domain are secret (tech.md 37.2, 38.2).
all:
  children:
    nodes:
      hosts:
        se-sto-1:
          ansible_host: 203.0.113.20
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/vpn_deploy
          ansible_ssh_common_args: -o IdentitiesOnly=yes
          node_name: se-sto-1
          node_country: SE
          node_fqdn: se-sto-1.example.com
