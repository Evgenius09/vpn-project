---
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ api_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the stack subdirectories
  ansible.builtin.file:
    path: "{{ api_host_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - compose
    - compose/api

- name: Copy the stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.src }}"
    dest: "{{ api_host_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: preserve
  loop:
    - { src: compose/api/, dest: compose/api/ }
    - { src: monitoring, dest: "" }
    - { src: catalog, dest: "" }

- name: Render the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ api_host_dir }}/compose/api/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart the stack

# The image may be private: the deploy job's token pulls it, and the host
# never keeps it, even when the start fails.
- name: Start the stack
  block:
    - name: Log in to the image registry
      ansible.builtin.command:
        cmd: docker login ghcr.io --username {{ registry_user }} --password-stdin
        stdin: "{{ registry_token }}"
      when: registry_token is defined
      no_log: true
      changed_when: false

    - name: Pull the images and start the services
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans --wait
        chdir: "{{ api_host_dir }}/compose/api"
      changed_when: true
  always:
    - name: Log out of the image registry
      ansible.builtin.command:
        cmd: docker logout ghcr.io
      when: registry_token is defined
      changed_when: false
