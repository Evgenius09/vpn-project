---
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ api_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the stack subdirectories
  ansible.builtin.file:
    path: "{{ api_host_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - compose
    - compose/api

- name: Copy the stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.src }}"
    dest: "{{ api_host_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: preserve
  loop:
    - { src: compose/api/, dest: compose/api/ }
    - { src: monitoring, dest: "" }

# The secret never leaves the host: GitHub does not need it (tech.md 38.4).
- name: Prepare the webhook secret
  when: telegram_mode == 'webhook'
  block:
    - name: Check the webhook port
      ansible.builtin.assert:
        that: (api_https_port | int) in [443, 80, 88, 8443]
        fail_msg: Telegram sends webhooks only to ports 443, 80, 88 and 8443.

    - name: Generate the webhook secret once
      ansible.builtin.shell:
        cmd: umask 077 && openssl rand -hex 32 > {{ api_host_dir }}/telegram-webhook-secret
        creates: "{{ api_host_dir }}/telegram-webhook-secret"

    - name: Read the webhook secret
      ansible.builtin.slurp:
        src: "{{ api_host_dir }}/telegram-webhook-secret"
      register: webhook_secret_file
      no_log: true

    - name: Use the webhook secret
      ansible.builtin.set_fact:
        telegram_webhook_secret: "{{ webhook_secret_file.content | b64decode | trim }}"
      no_log: true

- name: Prepare the panel tunnel
  when: panel_mode == 'remnawave'
  block:
    - name: Check the panel settings
      ansible.builtin.assert:
        that:
          - node_host | length > 0
          - panel_ssh_key_file | length > 0
          - node_known_hosts_file | length > 0
          - remnawave_api_token | length > 0
          - remnawave_squad_uuid | length > 0
        fail_msg: remnawave mode needs the node host, tunnel key, known_hosts, API token and squad.
        quiet: true
      no_log: true

    - name: Create the tunnel directory
      ansible.builtin.file:
        path: "{{ api_host_dir }}/panel-tunnel"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the tunnel key and the pinned host key
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ api_host_dir }}/panel-tunnel/{{ item.dest }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { src: "{{ panel_ssh_key_file }}", dest: key }
        - { src: "{{ node_known_hosts_file }}", dest: known_hosts }
      no_log: true
      notify: Restart the stack

- name: Render the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ api_host_dir }}/compose/api/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart the stack

# The image may be private: the deploy job's token pulls it, and the host
# never keeps it, even when the start fails.
- name: Start the stack
  block:
    - name: Log in to the image registry
      ansible.builtin.command:
        cmd: docker login ghcr.io --username {{ registry_user }} --password-stdin
        stdin: "{{ registry_token }}"
      when: registry_token is defined
      no_log: true
      changed_when: false

    - name: Pull the images and start the services
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans --wait
        chdir: "{{ api_host_dir }}/compose/api"
      changed_when: true
  always:
    - name: Log out of the image registry
      ansible.builtin.command:
        cmd: docker logout ghcr.io
      when: registry_token is defined
      changed_when: false

# Compose leaves a service of a disabled profile running, and its getUpdates
# would fight the webhook.
- name: Remove the polling bot outside polling mode
  ansible.builtin.command:
    cmd: docker compose --profile polling rm --stop --force bot
    chdir: "{{ api_host_dir }}/compose/api"
  register: polling_bot
  changed_when: "'Removed' in polling_bot.stderr"
  when: telegram_mode != 'polling'

- name: Point the bot webhook at the API
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/setWebhook"
    method: POST
    body_format: json
    body:
      url: "{{ api_public_url }}/telegram/webhook"
      secret_token: "{{ telegram_webhook_secret }}"
      allowed_updates: [message, callback_query, my_chat_member]
  when: telegram_mode == 'webhook'
  no_log: true
