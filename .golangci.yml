version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wrapcheck
  exclusions:
    generated: strict
    rules:
      # Tests may return raw errors from helpers.
      - path: _test\.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
