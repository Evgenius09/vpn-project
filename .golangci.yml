version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wrapcheck
  exclusions:
    generated: strict
    rules:
      # Tests may return raw errors from helpers.
      - path: _test\.go
        linters:
          - noctx
          - wrapcheck
      # tech.md 5.10 freezes these names.
      - path: internal/(panel/panel|telegram/telegram)\.go
        linters:
          - revive
        text: stutters

formatters:
  enable:
    - gofmt
    - goimports
